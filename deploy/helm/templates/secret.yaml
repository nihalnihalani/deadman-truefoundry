apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deadman.secretName" . }}
  labels:
    {{- include "deadman.labels" . | nindent 4 }}
  annotations:
    # WARNING: Do NOT commit real secret values in values.yaml.
    # Supply secrets at deploy time via --set secrets.<KEY>=<value>
    # or via an external-secrets operator.
type: Opaque
data:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
