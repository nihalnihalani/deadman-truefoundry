    DEADMAN — War-Room Frontend

    <!-- Inline fallback rendered before JS fires, replaced by app.js -->
    <div style="
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100vh;gap:16px;font-family:'Courier New',monospace;color:#7a8a9a;
    ">

    </div>
  </div>
