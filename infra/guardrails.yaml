# TrueFoundry Guardrails + MCP Gateway scopes for DEADMAN.
# Apply with:  tfy apply -f infra/guardrails.yaml
# Mirrors the AI Gateway -> Controls -> Guardrails model: WHEN REQUEST GOES TO /
# FROM SUBJECTS / APPLY ON HOOKS (pre-tool, post-tool). Verify field names against your tenant.

# ---- MCP Gateway: scoped tool access with Cedar default-DENY on destructive verbs ----
mcp_gateway:
  default: deny
  subjects:
    - role: incident-commander            # the DEADMAN agent's JWT role
      allow:
        - cw.get_metrics
        - logs.query
        - k8s.describe
        - statuspage.post
      allow_with_elevation:               # destructive verbs require an elevation token
        - k8s.cordon_drain
        - asg.scale
        - github.revert_pr
  audit:
    enabled: true
    export: otel                          # structured JSON audit log -> Grafana/Datadog/Splunk

guardrails:
  # ---- Pre-Tool: validate tool arguments BEFORE execution (denied call never runs) ----
  - name: block-scale-to-zero
    when_request_goes_to: { mcp_tool: asg.scale }
    from_subjects: [incident-commander]
    apply_on_hooks: [pre-tool]
    rule: "args.replicas >= 2"            # rejects a hallucinated 'scale to 0'
    on_violation: block

  - name: prod-drain-needs-elevation
    when_request_goes_to: { mcp_tool: k8s.cordon_drain }
    from_subjects: [incident-commander]
    apply_on_hooks: [pre-tool]
    rule: "args.namespace not in PROD_CRITICAL or context.elevation == true"
    on_violation: block

  - name: redact-secrets-before-statuspage
    when_request_goes_to: { mcp_tool: statuspage.post }
    apply_on_hooks: [pre-tool]
    action: redact
    redact: [secrets, pii, aws_keys]

  # ---- Post-Tool: inspect tool RESULTS before the model sees them (cascade-breaker) ----
  - name: catch-corrupt-tool-output
    when_request_goes_to: { mcp_tool: [cw.get_metrics, logs.query] }
    apply_on_hooks: [post-tool]
    rule: "is_valid_json(result) and not result.truncated"
    on_violation: block_and_refetch       # don't let garbage poison the plan

  # ---- LLM input guardrail: block prompt-injection from hostile log output ----
  - name: block-prompt-injection
    when_request_goes_to: { model: deadman-resilient-bedrock }
    apply_on_hooks: [pre-llm]
    detector: prompt-injection
    on_violation: block

# ---- Agent Gateway: couple authority to confidence (the WOW). When the AI Gateway
#      fallback depth crosses the threshold, auto-revoke destructive scope. ----
agent_gateway:
  autonomy_budget:
    subject: incident-commander
    couple_to: ai_gateway.fallback_depth
    revoke_destructive_at_depth: 2        # dumber brain -> shorter leash, automatically
    kill_switch:
      on_guardrail_block_rate: 0.5
      action: revoke_all_destructive_and_require_human
